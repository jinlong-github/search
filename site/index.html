<body class="reference-v31">
  <header class="topbar">
    <a class="brand" href="./" aria-label="科研情报系统首页">
      <span class="brand-mark" aria-hidden="true"><span>研</span><i></i></span>
      <span class="brand-copy"><strong>科研情报系统</strong><small>科研情报操作系统</small></span>
    </a>
    <div class="top-actions">
      <button id="densityToggle" class="ghost-btn density-btn" type="button" aria-pressed="false">紧凑视图</button>
      <button id="historyBtn" class="ghost-btn" type="button">历史</button>
      <button id="settingsBtn" class="ghost-btn" type="button">配置</button>
      <button id="exportBtn" class="ghost-btn" type="button">导出</button>
    </div>
  </header>

  <main class="shell">
    <section class="hero">
      <h1>研究一个技术，而不只是搜索它</h1>
      <p class="subtitle">把论文、专利、技术文章与工程信号放进同一研究会话：检索、聚类、时间演进、实体情报、证据研判与技术脉络连续工作。</p>
      <form id="searchForm" class="search-box">
        <label class="sr-only" for="queryInput">搜索关键词</label>
        <span class="search-icon" aria-hidden="true">⌕</span>
        <input id="queryInput" name="q" type="search" autocomplete="off" placeholder="输入技术问题、方法、作者、机构、专利或工程路径…" />
        <kbd>/</kbd>
        <button class="search-btn" type="submit">开始研究</button>
      </form>
      <div class="quick-queries" aria-label="快速搜索">
        <button type="button" data-query="B-Rep reconstruction CAD">B-Rep 三维重建</button>
        <button type="button" data-query="engineering drawing 3D reconstruction">工程图 → 三维 CAD</button>
        <button type="button" data-query="multimodal foundation model robotics">机器人多模态基础模型</button>
      </div>
    </section>

    <section id="searchWorkspace" class="workspace hidden" aria-live="polite">
      <nav class="tabs" aria-label="搜索类型">
        <button class="tab active" data-tab="all" type="button">综合</button>
        <button class="tab" data-tab="papers" type="button">论文 <span id="paperCount" class="count"></span></button>
        <button class="tab" data-tab="patents" type="button">专利 <span id="patentCount" class="count"></span></button>
        <button class="tab" data-tab="blogs" type="button">技术文章 <span id="blogCount" class="count"></span></button>
        <button class="tab" data-tab="web" type="button">网页 <span id="webCount" class="count"></span></button>
        <button class="tab" data-tab="saved" type="button">收藏 <span id="savedCount" class="count"></span></button>
      </nav>
      <div class="content-grid">
        <aside class="filters" aria-label="搜索筛选">
          <div class="filter-block"><label for="sortSelect">排序方式</label><select id="sortSelect"><option value="relevance">相关度</option><option value="cited">引用 / 影响力</option><option value="newest">最新</option></select></div>
          <div class="filter-block"><label for="fromYear">起始年份</label><input id="fromYear" type="number" min="1900" max="2100" placeholder="起始年份" /></div>
          <label class="check-row"><input id="oaOnly" type="checkbox" /><span>仅开放获取</span></label>
          <label class="check-row"><input id="officialOnly" type="checkbox" /><span>仅官方网站</span></label>
          <button id="applyFilters" class="secondary-btn" type="button">应用筛选</button>
          <div class="source-note sr-only"><span id="paperSourceLabel">论文 · Crossref</span><span id="patentSourceLabel">专利 · 专业数据库入口</span><span id="webSourceLabel">网页 · 外部搜索入口</span></div>
        </aside>
        <section class="results-pane">
          <div class="results-head"><div><p id="statusLine" class="status-line">准备搜索</p><h2 id="resultsTitle">检索结果</h2></div><button id="copyQueryBtn" class="ghost-btn compact" type="button">复制查询</button></div>
          <div id="errorBox" class="error-box hidden"></div>
          <div id="overviewBox" class="overview-card hidden"></div>
          <div id="loading" class="loading hidden"><span></span><span></span><span></span></div>
          <div id="results" class="results"></div>
        </section>
      </div>
    </section>
  </main>

  <dialog id="settingsDialog">
    <div class="dialog-head"><div><p class="dialog-kicker">数据源</p><h2>数据源设置</h2></div><button id="closeSettings" class="icon-btn" type="button" aria-label="关闭">×</button></div>
    <div class="settings-section web-settings-section"><label for="workerEndpoint">后端代理（Cloudflare Worker）地址</label><input id="workerEndpoint" class="settings-input" type="url" autocomplete="off" placeholder="https://research-search-api.xxx.workers.dev" /><p>配置后，官网和网页结果会直接显示在本站；若后端同时配置 PatentsView 密钥，专利也会优先通过后端代理访问。</p><div class="settings-inline-actions"><button id="testWorker" class="ghost-btn compact" type="button">测试连接</button><button id="clearWorker" class="ghost-btn compact" type="button">清除后端地址</button></div><div id="workerStatus" class="key-status"></div></div>
    <div class="settings-section"><label for="patentApiKey">PatentsView 接口密钥</label><input id="patentApiKey" class="settings-input" type="password" autocomplete="off" placeholder="输入 X-Api-Key（可选）" /><p>配置后专利会直接显示在搜索结果中。密钥只保存在你的浏览器。</p><label class="check-row settings-check"><input id="rememberPatentKey" type="checkbox" /><span>记住在这台设备上</span></label><div id="patentKeyStatus" class="key-status"></div></div>
    <div class="dialog-actions"><button id="clearPatentKey" class="danger-btn" type="button">清除密钥</button><button id="saveSettings" class="secondary-btn fit" type="button">保存设置</button></div>
  </dialog>

  <dialog id="historyDialog"><div class="dialog-head"><h2>搜索历史</h2><button id="closeHistory" class="icon-btn" type="button" aria-label="关闭">×</button></div><div id="historyList" class="history-list"></div><button id="clearHistory" class="danger-btn" type="button">清空历史</button></dialog>

  <footer><span>科研情报系统</span><a href="https://github.com/jinlong-github/search" target="_blank" rel="noreferrer">GitHub</a></footer>
