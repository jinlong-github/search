name: V32 Clarity Preview

on:
  push:
    branches: [agent/clarity-v32]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install CJK fonts
        run: |
          if ! fc-list :lang=zh | grep -q .; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends fonts-noto-cjk
            fc-cache -f
          fi
      - name: Static checks
        run: |
          node --check site/reference-v31.js
          node --check site/reference-v31-runtime-fix.js
          grep -q 'clarity-v32' site/reference-v31.js
          grep -q 'v32-analysis-nav' site/reference-v31-correction.css
      - name: Launch local site
        run: |
          python3 -m http.server 8000 -d site >/tmp/http.log 2>&1 &
          sleep 2
      - name: Capture clarity paths
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          "$CHROME" --headless --no-sandbox --disable-gpu --hide-scrollbars --window-size=1440,1000 --virtual-time-budget=9000 --screenshot=/tmp/home.png http://127.0.0.1:8000/
          "$CHROME" --headless --no-sandbox --disable-gpu --hide-scrollbars --window-size=1440,1000 --virtual-time-budget=32000 --screenshot=/tmp/search.png 'http://127.0.0.1:8000/?q=machine%20learning'
          "$CHROME" --headless --no-sandbox --disable-gpu --hide-scrollbars --window-size=1440,1000 --virtual-time-budget=40000 --screenshot=/tmp/map.png 'http://127.0.0.1:8000/?q=machine%20learning&view=map'
          "$CHROME" --headless --no-sandbox --disable-gpu --hide-scrollbars --window-size=1440,1000 --virtual-time-budget=10000 --screenshot=/tmp/settings.png 'http://127.0.0.1:8000/?settings=1'
          "$CHROME" --headless --no-sandbox --disable-gpu --hide-scrollbars --window-size=390,844 --virtual-time-budget=9000 --screenshot=/tmp/mobile.png http://127.0.0.1:8000/
      - name: DOM checks
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          "$CHROME" --headless --no-sandbox --disable-gpu --virtual-time-budget=12000 --dump-dom 'http://127.0.0.1:8000/?q=machine%20learning' >/tmp/search.html
          grep -q 'class="v31-app"' /tmp/search.html
          grep -q '研究分析' /tmp/search.html
          if grep -q 'RESEARCH SIGNAL' /tmp/search.html; then exit 1; fi
          "$CHROME" --headless --no-sandbox --disable-gpu --virtual-time-budget=12000 --dump-dom 'http://127.0.0.1:8000/?settings=1' >/tmp/settings.html
          grep -q 'simple-settings-v29-shell' /tmp/settings.html
          grep -q 'URL' /tmp/settings.html
          grep -q 'API' /tmp/settings.html
          grep -q 'Name' /tmp/settings.html
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: v32-clarity-evidence
          path: |
            /tmp/home.png
            /tmp/search.png
            /tmp/map.png
            /tmp/settings.png
            /tmp/mobile.png
          retention-days: 3
