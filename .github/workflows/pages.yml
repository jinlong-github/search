name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Static JavaScript checks
        run: |
          node --check site/app.js
          node --check site/sources.js
          node --check site/web.js
          node --check site/ux.js
          node --check site/status.js
          node --check site/bootstrap.js

      - name: Local browser search smoke test
        run: |
          set -euo pipefail
          python3 -m http.server 8000 -d site >/tmp/research-search-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          "$CHROME" --headless --no-sandbox --disable-gpu --virtual-time-budget=18000 \
            --dump-dom 'http://127.0.0.1:8000/?q=machine%20learning' >/tmp/search-dom.html 2>/tmp/chrome-local.log || {
              cat /tmp/chrome-local.log
              exit 1
            }
          PAPER_COUNT=$( (grep -o 'data-key="paper:crossref:[^"]*"' /tmp/search-dom.html || true) | wc -l | tr -d ' ' )
          BLOG_COUNT=$( (grep -o 'data-key="blog:[^"]*"' /tmp/search-dom.html || true) | wc -l | tr -d ' ' )
          echo "Local real results: Crossref papers=$PAPER_COUNT HN blogs=$BLOG_COUNT"
          if [ "$PAPER_COUNT" -lt 1 ] || [ "$BLOG_COUNT" -lt 1 ]; then
            echo 'Missing real Crossref or HN results locally.'
            echo '--- Chrome log ---'
            cat /tmp/chrome-local.log
            echo '--- Error/status ---'
            grep -o '<div id="errorBox"[^>]*>[^<]*' /tmp/search-dom.html || true
            grep -o '<p id="statusLine"[^>]*>[^<]*' /tmp/search-dom.html || true
            echo '--- Relevant DOM ---'
            grep -n -E 'Crossref|HN|data-key=|sources.js|errorBox|statusLine' /tmp/search-dom.html | head -120 || true
            exit 1
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Production browser search test
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          test -n "$PAGE_URL"

          echo "Testing deployed site: $PAGE_URL"
          for i in $(seq 1 12); do
            if curl -fsSL --retry 2 --max-time 15 "${PAGE_URL}?health=${REVISION}" >/tmp/prod-index.html; then
              break
            fi
            sleep 5
          done
          grep -q 'Research Search' /tmp/prod-index.html
          grep -q 'sources.js?v=7' /tmp/prod-index.html

          PROFILE=/tmp/research-search-prod-profile
          rm -rf "$PROFILE"

          "$CHROME" --headless --no-sandbox --disable-gpu \
            --user-data-dir="$PROFILE" --virtual-time-budget=6000 \
            --dump-dom "${PAGE_URL}?warm=${REVISION}" >/tmp/prod-warm.html 2>/tmp/chrome-prod-warm.log || {
              cat /tmp/chrome-prod-warm.log
              exit 1
            }

          "$CHROME" --headless --no-sandbox --disable-gpu \
            --user-data-dir="$PROFILE" --virtual-time-budget=20000 \
            --dump-dom "${PAGE_URL}?q=machine%20learning&prod=${REVISION}" >/tmp/prod-search.html 2>/tmp/chrome-prod-search.log || {
              cat /tmp/chrome-prod-search.log
              exit 1
            }

          PAPER_COUNT=$( (grep -o 'data-key="paper:crossref:[^"]*"' /tmp/prod-search.html || true) | wc -l | tr -d ' ' )
          BLOG_COUNT=$( (grep -o 'data-key="blog:[^"]*"' /tmp/prod-search.html || true) | wc -l | tr -d ' ' )
          echo "Production real results: Crossref papers=$PAPER_COUNT HN blogs=$BLOG_COUNT"
          grep -o '<p id="statusLine"[^>]*>[^<]*' /tmp/prod-search.html || true
          grep -o '<div id="errorBox"[^>]*>[^<]*' /tmp/prod-search.html || true

          if [ "$PAPER_COUNT" -lt 1 ] || [ "$BLOG_COUNT" -lt 1 ]; then
            echo 'Missing real Crossref or HN results on production.'
            echo '--- Chrome production log ---'
            cat /tmp/chrome-prod-search.log
            echo '--- Relevant DOM ---'
            grep -n -E 'errorBox|statusLine|Crossref|HN|没有找到论文|data-key=' /tmp/prod-search.html | head -120 || true
            exit 1
          fi

          echo 'Production Crossref and HN results rendered successfully.'
