name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Static JavaScript checks
        run: |
          node --check site/app.js
          node --check site/web.js
          node --check site/ux.js

      - name: Local browser search smoke test
        run: |
          python3 -m http.server 8000 -d site >/tmp/research-search-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          "$CHROME" --headless --no-sandbox --disable-gpu --virtual-time-budget=12000 \
            --dump-dom 'http://127.0.0.1:8000/?q=machine%20learning' >/tmp/search-dom.html 2>/tmp/chrome-local.log || {
              cat /tmp/chrome-local.log
              exit 1
            }
          if ! grep -Eq 'ux-result|result-card' /tmp/search-dom.html; then
            echo 'No local search result cards rendered.'
            cat /tmp/chrome-local.log
            sed -n '1,220p' /tmp/search-dom.html
            exit 1
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Production browser search test
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          test -n "$PAGE_URL"

          echo "Testing deployed site: $PAGE_URL"
          for i in $(seq 1 12); do
            if curl -fsSL --retry 2 --max-time 15 "${PAGE_URL}?health=${REVISION}" >/tmp/prod-index.html; then
              break
            fi
            sleep 5
          done
          grep -q 'Research Search' /tmp/prod-index.html

          PROFILE=/tmp/research-search-prod-profile
          rm -rf "$PROFILE"

          # First visit installs/activates the production service worker.
          "$CHROME" --headless --no-sandbox --disable-gpu \
            --user-data-dir="$PROFILE" --virtual-time-budget=8000 \
            --dump-dom "${PAGE_URL}?warm=${REVISION}" >/tmp/prod-warm.html 2>/tmp/chrome-prod-warm.log || {
              cat /tmp/chrome-prod-warm.log
              exit 1
            }

          # Second visit uses the same profile, so it exercises the deployed PWA/cache path too.
          "$CHROME" --headless --no-sandbox --disable-gpu \
            --user-data-dir="$PROFILE" --virtual-time-budget=15000 \
            --dump-dom "${PAGE_URL}?q=machine%20learning&prod=${REVISION}" >/tmp/prod-search.html 2>/tmp/chrome-prod-search.log || {
              cat /tmp/chrome-prod-search.log
              exit 1
            }

          if ! grep -Eq 'ux-result|result-card' /tmp/prod-search.html; then
            echo 'No production search result cards rendered.'
            echo '--- Chrome production log ---'
            cat /tmp/chrome-prod-search.log
            echo '--- Production DOM excerpt ---'
            sed -n '1,280p' /tmp/prod-search.html
            exit 1
          fi

          echo 'Production search rendered result cards successfully.'
