name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install CJK fonts for visual checks
        run: |
          if ! fc-list :lang=zh | grep -q .; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends fonts-noto-cjk
            fc-cache -f
          fi

      - name: Static JavaScript checks
        run: |
          node --check site/app.js
          node --check site/sources.js
          node --check site/web.js
          node --check site/ux.js
          node --check site/summaries.js
          node --check site/status.js
          node --check site/bootstrap.js
          node --check site/ui.js
          node --check site/research-final.js
          node --check site/research-deeplink.js
          node --check worker/src/index.js
          test -s site/research-v13.css
          grep -q 'research-v13.css?v=13' site/index.html
          grep -q 'research-final.js?v=13' site/index.html
          grep -q 'research-deeplink.js?v=13' site/index.html

      - name: Local research workflow test
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8000 -d site >/tmp/research-local-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"

          "$CHROME" --headless --no-sandbox --disable-gpu --virtual-time-budget=26000 \
            --dump-dom 'http://127.0.0.1:8000/?q=machine%20learning' >/tmp/local-general.html 2>/tmp/local-general.log
          PAPER_COUNT=$( (grep -o 'data-key="paper:crossref:[^"]*"' /tmp/local-general.html || true) | wc -l | tr -d ' ' )
          BLOG_COUNT=$( (grep -o 'data-key="blog:[^"]*"' /tmp/local-general.html || true) | wc -l | tr -d ' ' )
          SUMMARY_COUNT=$( (grep -o 'class="ux-zh-summary"' /tmp/local-general.html || true) | wc -l | tr -d ' ' )
          PREVIEW_COUNT=$( (grep -o 'class="research-preview-btn"' /tmp/local-general.html || true) | wc -l | tr -d ' ' )
          ENHANCED_COUNT=$( (grep -o 'data-research-enhanced="1"' /tmp/local-general.html || true) | wc -l | tr -d ' ' )
          EXPECTED=$((PAPER_COUNT + BLOG_COUNT))
          echo "Local general: papers=$PAPER_COUNT blogs=$BLOG_COUNT summaries=$SUMMARY_COUNT previews=$PREVIEW_COUNT enhanced=$ENHANCED_COUNT"
          test "$PAPER_COUNT" -ge 1
          test "$BLOG_COUNT" -ge 1
          test "$SUMMARY_COUNT" -ge "$EXPECTED"
          test "$PREVIEW_COUNT" -ge "$EXPECTED"
          test "$ENHANCED_COUNT" -ge "$EXPECTED"
          grep -q 'class="research-controlbar"' /tmp/local-general.html

          "$CHROME" --headless --no-sandbox --disable-gpu --virtual-time-budget=28000 \
            --dump-dom 'http://127.0.0.1:8000/?q=engineering%20drawing%203D%20reconstruction&detail=first' >/tmp/local-engineering.html 2>/tmp/local-engineering.log
          ENG_PAPERS=$( (grep -o 'data-key="paper:crossref:[^"]*"' /tmp/local-engineering.html || true) | wc -l | tr -d ' ' )
          ENG_SUMMARIES=$( (grep -o 'class="ux-zh-summary"' /tmp/local-engineering.html || true) | wc -l | tr -d ' ' )
          echo "Local engineering: papers=$ENG_PAPERS summaries=$ENG_SUMMARIES"
          test "$ENG_PAPERS" -ge 1
          test "$ENG_SUMMARIES" -ge "$ENG_PAPERS"
          grep -q 'class="research-detail-pane open"' /tmp/local-engineering.html
          grep -q '检索匹配' /tmp/local-engineering.html
          grep -q '复制引用' /tmp/local-engineering.html
          grep -q '复制 BibTeX' /tmp/local-engineering.html
          grep -q 'data-integrity="placeholder-hidden"' /tmp/local-engineering.html
          if grep -q '&amp;amp;' /tmp/local-engineering.html; then
            echo 'Double-escaped scholarly metadata detected locally.'
            exit 1
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Production research workflow test
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          REVISION: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          test -n "$PAGE_URL"

          echo "Testing deployed site: $PAGE_URL"
          for i in $(seq 1 12); do
            if curl -fsSL --retry 2 --max-time 15 "${PAGE_URL}?health=${REVISION}" >/tmp/prod-index.html; then
              break
            fi
            sleep 5
          done
          grep -q 'Research Search' /tmp/prod-index.html
          grep -q 'research-v13.css?v=13' /tmp/prod-index.html
          grep -q 'research-final.js?v=13' /tmp/prod-index.html
          grep -q 'research-deeplink.js?v=13' /tmp/prod-index.html

          PROFILE=/tmp/research-prod-profile
          rm -rf "$PROFILE"
          "$CHROME" --headless --no-sandbox --disable-gpu \
            --user-data-dir="$PROFILE" --virtual-time-budget=5000 \
            --dump-dom "${PAGE_URL}?warm=${REVISION}" >/tmp/prod-warm.html 2>/tmp/prod-warm.log

          "$CHROME" --headless --no-sandbox --disable-gpu \
            --user-data-dir="$PROFILE" --virtual-time-budget=26000 \
            --dump-dom "${PAGE_URL}?q=machine%20learning&prod=${REVISION}" >/tmp/prod-general.html 2>/tmp/prod-general.log
          PAPER_COUNT=$( (grep -o 'data-key="paper:crossref:[^"]*"' /tmp/prod-general.html || true) | wc -l | tr -d ' ' )
          BLOG_COUNT=$( (grep -o 'data-key="blog:[^"]*"' /tmp/prod-general.html || true) | wc -l | tr -d ' ' )
          SUMMARY_COUNT=$( (grep -o 'class="ux-zh-summary"' /tmp/prod-general.html || true) | wc -l | tr -d ' ' )
          PREVIEW_COUNT=$( (grep -o 'class="research-preview-btn"' /tmp/prod-general.html || true) | wc -l | tr -d ' ' )
          EXPECTED=$((PAPER_COUNT + BLOG_COUNT))
          echo "Production general: papers=$PAPER_COUNT blogs=$BLOG_COUNT summaries=$SUMMARY_COUNT previews=$PREVIEW_COUNT"
          test "$PAPER_COUNT" -ge 1
          test "$BLOG_COUNT" -ge 1
          test "$SUMMARY_COUNT" -ge "$EXPECTED"
          test "$PREVIEW_COUNT" -ge "$EXPECTED"

          QUERY='engineering%20drawing%203D%20reconstruction'
          "$CHROME" --headless --no-sandbox --disable-gpu \
            --user-data-dir="$PROFILE" --virtual-time-budget=28000 \
            --dump-dom "${PAGE_URL}?q=${QUERY}&detail=first&prod=${REVISION}" >/tmp/prod-engineering.html 2>/tmp/prod-engineering.log
          ENG_PAPERS=$( (grep -o 'data-key="paper:crossref:[^"]*"' /tmp/prod-engineering.html || true) | wc -l | tr -d ' ' )
          ENG_SUMMARIES=$( (grep -o 'class="ux-zh-summary"' /tmp/prod-engineering.html || true) | wc -l | tr -d ' ' )
          echo "Production engineering: papers=$ENG_PAPERS summaries=$ENG_SUMMARIES"
          test "$ENG_PAPERS" -ge 1
          test "$ENG_SUMMARIES" -ge "$ENG_PAPERS"
          grep -q 'class="research-detail-pane open"' /tmp/prod-engineering.html
          grep -q '复制引用' /tmp/prod-engineering.html
          grep -q '复制 BibTeX' /tmp/prod-engineering.html
          grep -q 'data-integrity="placeholder-hidden"' /tmp/prod-engineering.html
          if grep -q '&amp;amp;' /tmp/prod-engineering.html; then
            echo 'Double-escaped scholarly metadata detected in production.'
            exit 1
          fi

          "$CHROME" --headless --no-sandbox --disable-gpu --hide-scrollbars --virtual-time-budget=28000 \
            --window-size=1440,1200 --screenshot=/tmp/research-prod-desktop.png \
            "${PAGE_URL}?q=${QUERY}&screenshot=${REVISION}" >/tmp/prod-shot-desktop.log 2>&1
          "$CHROME" --headless --no-sandbox --disable-gpu --hide-scrollbars --virtual-time-budget=28000 \
            --window-size=430,932 --screenshot=/tmp/research-prod-mobile.png \
            "${PAGE_URL}?q=${QUERY}&screenshot=${REVISION}-mobile" >/tmp/prod-shot-mobile.log 2>&1
          "$CHROME" --headless --no-sandbox --disable-gpu --hide-scrollbars --virtual-time-budget=28000 \
            --window-size=1440,1200 --screenshot=/tmp/research-prod-detail.png \
            "${PAGE_URL}?q=${QUERY}&detail=first&screenshot=${REVISION}-detail" >/tmp/prod-shot-detail.log 2>&1
          test -s /tmp/research-prod-desktop.png
          test -s /tmp/research-prod-mobile.png
          test -s /tmp/research-prod-detail.png
          echo 'Production v13 research workflow rendered successfully.'

      - name: Upload UI screenshots
        uses: actions/upload-artifact@v4
        with:
          name: research-ui-v13
          path: |
            /tmp/research-prod-desktop.png
            /tmp/research-prod-mobile.png
            /tmp/research-prod-detail.png
          if-no-files-found: error
          retention-days: 3
