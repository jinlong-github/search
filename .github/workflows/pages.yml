name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Static JavaScript checks
        run: |
          node --check site/app.js
          node --check site/sources.js
          node --check site/web.js
          node --check site/ux.js
          node --check site/summaries.js
          node --check site/status.js
          node --check site/bootstrap.js
          node --check site/ui.js
          node --check worker/src/index.js
          test -s site/research.css

      - name: Local browser search smoke test
        run: |
          set -euo pipefail
          python3 -m http.server 8000 -d site >/tmp/research-search-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          "$CHROME" --headless --no-sandbox --disable-gpu --virtual-time-budget=18000 \
            --dump-dom 'http://127.0.0.1:8000/?q=machine%20learning' >/tmp/search-dom.html 2>/tmp/chrome-local.log || {
              cat /tmp/chrome-local.log
              exit 1
            }
          PAPER_COUNT=$( (grep -o 'data-key="paper:crossref:[^"]*"' /tmp/search-dom.html || true) | wc -l | tr -d ' ' )
          BLOG_COUNT=$( (grep -o 'data-key="blog:[^"]*"' /tmp/search-dom.html || true) | wc -l | tr -d ' ' )
          SUMMARY_COUNT=$( (grep -o 'class="ux-zh-summary"' /tmp/search-dom.html || true) | wc -l | tr -d ' ' )
          SECTION_COUNT=$( (grep -o 'class="ux-section-head"' /tmp/search-dom.html || true) | wc -l | tr -d ' ' )
          EXPECTED_SUMMARIES=$((PAPER_COUNT + BLOG_COUNT))
          grep -q 'Research Search' /tmp/search-dom.html
          grep -q 'workspace-mode' /tmp/search-dom.html
          echo "Local results: Crossref papers=$PAPER_COUNT HN blogs=$BLOG_COUNT summaries=$SUMMARY_COUNT source_sections=$SECTION_COUNT"
          if [ "$PAPER_COUNT" -lt 1 ] || [ "$BLOG_COUNT" -lt 1 ] || [ "$SUMMARY_COUNT" -lt "$EXPECTED_SUMMARIES" ] || [ "$SECTION_COUNT" -ne 0 ]; then
            echo 'Scholarly result stream validation failed locally.'
            cat /tmp/chrome-local.log
            grep -n -E 'Crossref|HN|中文摘要|ux-zh-summary|ux-section-head|data-key=|errorBox|statusLine' /tmp/search-dom.html | head -160 || true
            exit 1
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Production browser search test
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          test -n "$PAGE_URL"

          echo "Testing deployed site: $PAGE_URL"
          for i in $(seq 1 12); do
            if curl -fsSL --retry 2 --max-time 15 "${PAGE_URL}?health=${REVISION}" >/tmp/prod-index.html; then
              break
            fi
            sleep 5
          done
          grep -q 'Research Search' /tmp/prod-index.html
          grep -q 'research.css?v=12' /tmp/prod-index.html
          grep -q 'ux.js?v=12' /tmp/prod-index.html
          grep -q 'summaries.js?v=12' /tmp/prod-index.html

          PROFILE=/tmp/research-search-prod-profile
          rm -rf "$PROFILE"

          "$CHROME" --headless --no-sandbox --disable-gpu \
            --user-data-dir="$PROFILE" --virtual-time-budget=6000 \
            --dump-dom "${PAGE_URL}?warm=${REVISION}" >/tmp/prod-warm.html 2>/tmp/chrome-prod-warm.log || {
              cat /tmp/chrome-prod-warm.log
              exit 1
            }

          "$CHROME" --headless --no-sandbox --disable-gpu \
            --user-data-dir="$PROFILE" --virtual-time-budget=20000 \
            --dump-dom "${PAGE_URL}?q=machine%20learning&prod=${REVISION}" >/tmp/prod-search.html 2>/tmp/chrome-prod-search.log || {
              cat /tmp/chrome-prod-search.log
              exit 1
            }

          PAPER_COUNT=$( (grep -o 'data-key="paper:crossref:[^"]*"' /tmp/prod-search.html || true) | wc -l | tr -d ' ' )
          BLOG_COUNT=$( (grep -o 'data-key="blog:[^"]*"' /tmp/prod-search.html || true) | wc -l | tr -d ' ' )
          SUMMARY_COUNT=$( (grep -o 'class="ux-zh-summary"' /tmp/prod-search.html || true) | wc -l | tr -d ' ' )
          SECTION_COUNT=$( (grep -o 'class="ux-section-head"' /tmp/prod-search.html || true) | wc -l | tr -d ' ' )
          EXPECTED_SUMMARIES=$((PAPER_COUNT + BLOG_COUNT))
          grep -q 'workspace-mode' /tmp/prod-search.html
          echo "Production results: Crossref papers=$PAPER_COUNT HN blogs=$BLOG_COUNT summaries=$SUMMARY_COUNT source_sections=$SECTION_COUNT"

          if [ "$PAPER_COUNT" -lt 1 ] || [ "$BLOG_COUNT" -lt 1 ] || [ "$SUMMARY_COUNT" -lt "$EXPECTED_SUMMARIES" ] || [ "$SECTION_COUNT" -ne 0 ]; then
            echo 'Production scholarly UI validation failed.'
            cat /tmp/chrome-prod-search.log
            grep -n -E 'errorBox|statusLine|Crossref|HN|中文摘要|ux-zh-summary|ux-section-head|data-key=' /tmp/prod-search.html | head -160 || true
            exit 1
          fi

          "$CHROME" --headless --no-sandbox --disable-gpu \
            --window-size=1440,1200 --virtual-time-budget=20000 \
            --screenshot=/tmp/research-prod.png \
            "${PAGE_URL}?q=machine%20learning&screenshot=${REVISION}" >/tmp/chrome-shot.log 2>&1 || {
              cat /tmp/chrome-shot.log
              exit 1
            }
          test -s /tmp/research-prod.png
          echo 'Production scholarly result stream rendered successfully.'

      - name: Upload UI screenshot
        uses: actions/upload-artifact@v4
        with:
          name: research-ui-v12
          path: /tmp/research-prod.png
          if-no-files-found: error
          retention-days: 3
