name: V25 Full Interaction Audit

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install browser harness
        run: npm install --no-save playwright-core@1.54.2
      - name: Run local site
        run: |
          python3 -m http.server 8000 -d site >/tmp/v25-http.log 2>&1 &
          echo $! >/tmp/v25-http.pid
      - name: Full interaction audit
        run: node tests/interaction-v25.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v25-interaction-audit
          path: |
            /tmp/v25-desktop.png
            /tmp/v25-mobile.png
          if-no-files-found: ignore
          retention-days: 2
