name: Research v13 UI Test

on:
  push:
    branches: [research-v13-work]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install CJK fonts for visual test
        run: |
          if ! fc-list :lang=zh | grep -q .; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends fonts-noto-cjk
            fc-cache -f
          fi

      - name: Static checks
        run: |
          node --check site/app.js
          node --check site/sources.js
          node --check site/web.js
          node --check site/ux.js
          node --check site/summaries.js
          node --check site/status.js
          node --check site/ui.js
          node --check site/research-final.js
          node --check site/research-deeplink.js
          grep -q 'research-v13.css?v=13' site/index.html
          grep -q 'research-final.js?v=13' site/index.html
          grep -q 'research-deeplink.js?v=13' site/index.html

      - name: Browser research workflow smoke test
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8000 -d site >/tmp/research-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          "$CHROME" --headless --no-sandbox --disable-gpu --virtual-time-budget=26000 \
            --dump-dom 'http://127.0.0.1:8000/?q=machine%20learning' >/tmp/search-dom.html 2>/tmp/chrome.log
          PAPER_COUNT=$( (grep -o 'data-key="paper:crossref:[^"]*"' /tmp/search-dom.html || true) | wc -l | tr -d ' ' )
          BLOG_COUNT=$( (grep -o 'data-key="blog:[^"]*"' /tmp/search-dom.html || true) | wc -l | tr -d ' ' )
          SUMMARY_COUNT=$( (grep -o 'class="ux-zh-summary"' /tmp/search-dom.html || true) | wc -l | tr -d ' ' )
          PREVIEW_COUNT=$( (grep -o 'class="research-preview-btn"' /tmp/search-dom.html || true) | wc -l | tr -d ' ' )
          ENHANCED_COUNT=$( (grep -o 'data-research-enhanced="1"' /tmp/search-dom.html || true) | wc -l | tr -d ' ' )
          EXPECTED=$((PAPER_COUNT + BLOG_COUNT))
          echo "papers=$PAPER_COUNT blogs=$BLOG_COUNT summaries=$SUMMARY_COUNT previews=$PREVIEW_COUNT enhanced=$ENHANCED_COUNT"
          if [ "$PAPER_COUNT" -lt 1 ] || [ "$BLOG_COUNT" -lt 1 ] || [ "$SUMMARY_COUNT" -lt "$EXPECTED" ] || [ "$PREVIEW_COUNT" -lt "$EXPECTED" ] || [ "$ENHANCED_COUNT" -lt "$EXPECTED" ]; then
            cat /tmp/chrome.log || true
            grep -n -E 'research-controlbar|research-preview-btn|researchDetailPane|data-research-enhanced|ux-result|中文摘要|errorBox|statusLine' /tmp/search-dom.html | head -220 || true
            exit 1
          fi
          grep -q 'class="research-controlbar"' /tmp/search-dom.html
          grep -q 'id="researchDetailPane"' /tmp/search-dom.html
          grep -q 'class="research-filter-toggle"' /tmp/search-dom.html

      - name: Scholarly detail pane test
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8000 -d site >/tmp/research-detail-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          "$CHROME" --headless --no-sandbox --disable-gpu --virtual-time-budget=26000 \
            --dump-dom 'http://127.0.0.1:8000/?q=machine%20learning&detail=first' >/tmp/detail-dom.html 2>/tmp/detail-chrome.log
          grep -q 'class="research-detail-pane open"' /tmp/detail-dom.html
          grep -q '检索匹配' /tmp/detail-dom.html
          grep -q '复制引用' /tmp/detail-dom.html
          grep -q '复制 BibTeX' /tmp/detail-dom.html
          grep -q 'research-active-result' /tmp/detail-dom.html

      - name: Engineering-domain search test
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8000 -d site >/tmp/research-engineering-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          "$CHROME" --headless --no-sandbox --disable-gpu --virtual-time-budget=28000 \
            --dump-dom 'http://127.0.0.1:8000/?q=engineering%20drawing%203D%20reconstruction' >/tmp/engineering-dom.html 2>/tmp/engineering-chrome.log
          ENG_PAPERS=$( (grep -o 'data-key="paper:crossref:[^"]*"' /tmp/engineering-dom.html || true) | wc -l | tr -d ' ' )
          ENG_SUMMARIES=$( (grep -o 'class="ux-zh-summary"' /tmp/engineering-dom.html || true) | wc -l | tr -d ' ' )
          echo "engineering papers=$ENG_PAPERS summaries=$ENG_SUMMARIES"
          test "$ENG_PAPERS" -ge 1
          test "$ENG_SUMMARIES" -ge "$ENG_PAPERS"
          if grep -Eqi '<h3 class="ux-title"[^>]*>.*(>Index<|>Contents<|>Table of Contents<|>Editorial[:<])' /tmp/engineering-dom.html; then
            echo 'Low-value scholarly record leaked into engineering results.'
            exit 1
          fi

      - name: Capture research screenshots
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8000 -d site >/tmp/research-visual-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          QUERY='engineering%20drawing%203D%20reconstruction'
          "$CHROME" --headless --no-sandbox --disable-gpu --hide-scrollbars --virtual-time-budget=28000 \
            --window-size=1440,1200 --screenshot=/tmp/research-desktop.png \
            "http://127.0.0.1:8000/?q=${QUERY}&visual=v13" >/tmp/desktop.log 2>&1 || { cat /tmp/desktop.log; exit 1; }
          "$CHROME" --headless --no-sandbox --disable-gpu --hide-scrollbars --virtual-time-budget=28000 \
            --window-size=430,932 --screenshot=/tmp/research-mobile.png \
            "http://127.0.0.1:8000/?q=${QUERY}&visual=v13-mobile" >/tmp/mobile.log 2>&1 || { cat /tmp/mobile.log; exit 1; }
          "$CHROME" --headless --no-sandbox --disable-gpu --hide-scrollbars --virtual-time-budget=28000 \
            --window-size=1440,1200 --screenshot=/tmp/research-detail.png \
            "http://127.0.0.1:8000/?q=${QUERY}&detail=first&visual=v13-detail" >/tmp/detail.log 2>&1 || { cat /tmp/detail.log; exit 1; }
          test -s /tmp/research-desktop.png
          test -s /tmp/research-mobile.png
          test -s /tmp/research-detail.png

      - name: Upload visual evidence
        uses: actions/upload-artifact@v4
        with:
          name: research-v13-screenshots
          path: |
            /tmp/research-desktop.png
            /tmp/research-mobile.png
            /tmp/research-detail.png
          retention-days: 3
