name: V31 Preview Audit

on:
  push:
    branches: [agent/reference-ui-v31-impl]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install CJK fonts
        run: |
          if ! fc-list :lang=zh | grep -q .; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends fonts-noto-cjk
            fc-cache -f
          fi

      - name: Syntax checks
        run: |
          node --check site/bootstrap.js
          node --check site/reference-v31.js
          test -s site/reference-v31.css
          test -s site/reference-v31-correction.css
          test -s site/reference-v31-dialog-fit.css
          grep -q 'reference-v31.css?v=31' site/bootstrap.js
          grep -q 'reference-v31-correction.css?v=31.1' site/bootstrap.js
          grep -q 'reference-v31-dialog-fit.css?v=31.2' site/bootstrap.js
          grep -q 'reference-v31.js?v=31' site/bootstrap.js

      - name: Add preview-only computed-style probe
        run: |
          cat > site/v31-preview-probe.js <<'JS'
          window.addEventListener('load',()=>setTimeout(()=>{
            const dialog=document.querySelector('#settingsDialog');
            if(!dialog)return;
            const style=getComputedStyle(dialog);
            const shell=dialog.querySelector('.simple-settings-v29-shell');
            const shellStyle=shell?getComputedStyle(shell):null;
            const probe=document.createElement('pre');
            probe.id='v31ComputedProbe';
            probe.hidden=true;
            probe.textContent=JSON.stringify({
              dialog:{height:style.height,minHeight:style.minHeight,maxHeight:style.maxHeight,display:style.display,gridTemplateRows:style.gridTemplateRows,blockSize:style.blockSize},
              rect:{height:Math.round(dialog.getBoundingClientRect().height),width:Math.round(dialog.getBoundingClientRect().width)},
              shell:shellStyle?{height:shellStyle.height,minHeight:shellStyle.minHeight,maxHeight:shellStyle.maxHeight,display:shellStyle.display,blockSize:shellStyle.blockSize}:null
            });
            document.body.appendChild(probe);
          },5000),{once:true});
          JS
          python3 - <<'PY'
          from pathlib import Path
          p=Path('site/index.html')
          s=p.read_text()
          s=s.replace('</body>','<script src="./v31-preview-probe.js"></script>\n</body>')
          p.write_text(s)
          PY

      - name: Launch local site
        run: |
          python3 -m http.server 8000 -d site >/tmp/v31-http.log 2>&1 &
          echo $! > /tmp/v31-http.pid
          sleep 2

      - name: Capture previews
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          "$CHROME" --headless --no-sandbox --disable-gpu --hide-scrollbars --window-size=1440,1000 --virtual-time-budget=7000 --screenshot=/tmp/v31-home.png http://127.0.0.1:8000/
          "$CHROME" --headless --no-sandbox --disable-gpu --hide-scrollbars --window-size=1440,1000 --virtual-time-budget=26000 --screenshot=/tmp/v31-search.png 'http://127.0.0.1:8000/?q=machine%20learning'
          "$CHROME" --headless --no-sandbox --disable-gpu --hide-scrollbars --window-size=1440,1000 --virtual-time-budget=28000 --screenshot=/tmp/v31-map.png 'http://127.0.0.1:8000/?q=machine%20learning&view=map'
          "$CHROME" --headless --no-sandbox --disable-gpu --hide-scrollbars --window-size=1440,1000 --virtual-time-budget=10000 --screenshot=/tmp/v31-settings.png 'http://127.0.0.1:8000/?settings=1'
          "$CHROME" --headless --no-sandbox --disable-gpu --hide-scrollbars --window-size=390,844 --virtual-time-budget=8000 --screenshot=/tmp/v31-mobile.png http://127.0.0.1:8000/
          test -s /tmp/v31-home.png
          test -s /tmp/v31-search.png
          test -s /tmp/v31-map.png
          test -s /tmp/v31-settings.png
          test -s /tmp/v31-mobile.png

      - name: DOM and computed-style smoke
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          "$CHROME" --headless --no-sandbox --disable-gpu --virtual-time-budget=9000 --dump-dom http://127.0.0.1:8000/ >/tmp/v31-dom.html
          grep -q 'class="v31-app"' /tmp/v31-dom.html
          grep -q 'RESEARCH OS' /tmp/v31-dom.html
          grep -q '研究信号' /tmp/v31-dom.html
          grep -q 'data-v31-view="map"' /tmp/v31-dom.html
          "$CHROME" --headless --no-sandbox --disable-gpu --virtual-time-budget=11000 --dump-dom 'http://127.0.0.1:8000/?settings=1' >/tmp/v31-settings-dom.html
          echo 'COMPUTED SETTINGS LAYOUT:'
          grep -o '<pre id="v31ComputedProbe"[^>]*>[^<]*' /tmp/v31-settings-dom.html || true

      - name: Upload previews
        uses: actions/upload-artifact@v4
        with:
          name: v31-preview
          path: |
            /tmp/v31-home.png
            /tmp/v31-search.png
            /tmp/v31-map.png
            /tmp/v31-settings.png
            /tmp/v31-mobile.png
            /tmp/v31-settings-dom.html
          retention-days: 3
