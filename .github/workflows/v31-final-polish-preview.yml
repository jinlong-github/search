name: V31 Final Polish Preview

on:
  push:
    branches: [agent/v31-final-polish]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install CJK fonts
        run: |
          if ! fc-list :lang=zh | grep -q .; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends fonts-noto-cjk
            fc-cache -f
          fi
      - name: Static checks
        run: |
          node --check site/bootstrap.js
          node --check site/reference-v31-runtime-fix.js
          grep -q 'bootstrap.js?v=31' site/index.html
          grep -q 'reference-v31-runtime-fix.js?v=31.3' site/bootstrap.js
      - name: Preview
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8000 -d site >/tmp/http.log 2>&1 &
          sleep 2
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          "$CHROME" --headless --no-sandbox --disable-gpu --hide-scrollbars --window-size=1440,1000 --virtual-time-budget=10000 --screenshot=/tmp/home.png http://127.0.0.1:8000/
          "$CHROME" --headless --no-sandbox --disable-gpu --hide-scrollbars --window-size=1440,1000 --virtual-time-budget=12000 --screenshot=/tmp/settings.png 'http://127.0.0.1:8000/?settings=1'
          "$CHROME" --headless --no-sandbox --disable-gpu --virtual-time-budget=12000 --dump-dom 'http://127.0.0.1:8000/?settings=1' >/tmp/settings.html
          grep -q 'simple-settings-v29-shell' /tmp/settings.html
          grep -q 'reference-v31-runtime-fix.js?v=31.3' /tmp/settings.html
      - name: Upload previews
        uses: actions/upload-artifact@v4
        with:
          name: v31-final-polish-preview
          path: |
            /tmp/home.png
            /tmp/settings.png
          retention-days: 3
