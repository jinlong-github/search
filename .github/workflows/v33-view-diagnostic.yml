name: V33 View Diagnostic

on:
  push:
    branches: [agent/v33-release-ci-fix]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install CJK fonts
        run: |
          if ! fc-list :lang=zh | grep -q .; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends fonts-noto-cjk
            fc-cache -f
          fi
      - name: Check each research view marker
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8000 -d site >/tmp/http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          QUERY='engineering%20drawing%203D%20reconstruction'

          dump() {
            local view="$1"
            "$CHROME" --headless --no-sandbox --disable-gpu --virtual-time-budget=34000 \
              --dump-dom "http://127.0.0.1:8000/?q=${QUERY}&view=${view}" >"/tmp/${view}.html" 2>"/tmp/${view}.log"
          }
          check() {
            local file="$1" label="$2" pattern="$3"
            if grep -q "$pattern" "$file"; then
              echo "PASS [$label] $pattern"
            else
              echo "MISSING [$label] $pattern"
              return 1
            fi
          }

          dump map
          MAP_NODES=$( (grep -o 'research-map-node' /tmp/map.html || true) | wc -l | tr -d ' ' )
          MAP_CLUSTERS=$( (grep -o 'research-map-cluster-label' /tmp/map.html || true) | wc -l | tr -d ' ' )
          echo "MAP nodes=$MAP_NODES clusters=$MAP_CLUSTERS"
          check /tmp/map.html map-title '研究地图'
          check /tmp/map.html map-disclaimer '不代表真实引用、合作或语义向量距离'

          dump timeline
          YEAR_COLS=$( (grep -o 'research-year-column' /tmp/timeline.html || true) | wc -l | tr -d ' ' )
          echo "TIMELINE year_cols=$YEAR_COLS"
          test "$YEAR_COLS" -ge 3
          check /tmp/timeline.html timeline-title '时间演进'
          check /tmp/timeline.html timeline-first '最早信号'
          check /tmp/timeline.html timeline-peak '密度峰值'
          check /tmp/timeline.html timeline-latest '最新信号'

          dump entities
          ENTITY_PANELS=$( (grep -o 'research-entity-panel' /tmp/entities.html || true) | wc -l | tr -d ' ' )
          ENTITY_ROWS=$( (grep -o 'research-entity-row' /tmp/entities.html || true) | wc -l | tr -d ' ' )
          echo "ENTITIES panels=$ENTITY_PANELS rows=$ENTITY_ROWS"
          test "$ENTITY_PANELS" -ge 3
          test "$ENTITY_ROWS" -ge 3
          check /tmp/entities.html entity-title '实体情报'
          check /tmp/entities.html entity-author '>作者<'
          check /tmp/entities.html entity-source '来源与域名'

          dump path
          PATH_NODES=$( (grep -o 'research-path-node' /tmp/path.html || true) | wc -l | tr -d ' ' )
          echo "PATH nodes=$PATH_NODES"
          test "$PATH_NODES" -ge 4
          check /tmp/path.html path-query '检索问题'
          check /tmp/path.html path-research '学术研究'
          check /tmp/path.html path-ip '知识产权'
          check /tmp/path.html path-engineering '工程落地'
          check /tmp/path.html path-patent-warning '不能据此推断专利空白'
          check /tmp/path.html path-relation-warning '不代表引用、专利族、技术转让'
