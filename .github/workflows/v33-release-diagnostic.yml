name: V33 Release Diagnostic

on:
  push:
    branches: [agent/v33-release-fix]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install CJK fonts
        run: |
          if ! fc-list :lang=zh | grep -q .; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends fonts-noto-cjk
            fc-cache -f
          fi
      - name: Launch site and print smoke markers
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8000 -d site >/tmp/http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          "$CHROME" --headless --no-sandbox --disable-gpu --virtual-time-budget=30000 --dump-dom 'http://127.0.0.1:8000/?q=machine%20learning' >/tmp/general.html 2>/tmp/chrome.log

          missing=0
          check() {
            local label="$1"
            local pattern="$2"
            if grep -q "$pattern" /tmp/general.html; then
              echo "PASS: $label"
            else
              echo "MISSING: $label :: $pattern"
              missing=1
            fi
          }

          check researchOsRail 'id="researchOsRail"'
          check researchOsStatusbar 'id="researchOsStatusbar"'
          check researchCommandPalette 'id="researchCommandPalette"'
          check research-live-scan 'research-live-scan'
          check product-name '科研情报系统'
          check product-subtitle '科研情报操作系统'
          check research-session-copy '研究会话'
          check result-copy '条结果'

          if grep -q '>SESSION<' /tmp/general.html; then
            echo 'UNEXPECTED: untranslated SESSION'
            missing=1
          else
            echo 'PASS: no untranslated SESSION'
          fi

          echo '--- matching context ---'
          grep -o -E '.{0,60}(研究会话|条结果|research-live-scan|科研情报操作系统).{0,80}' /tmp/general.html | head -40 || true
          test "$missing" -eq 0
